<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Login</h1>
    <form id="loginForm" class="card">
      <div class="form-row">
        <label>Username</label>
        <input type="text" id="username" required placeholder="Enter username">

        <label>Password</label>
        <input type="password" id="password" required placeholder="Enter password">

        <button type="submit">Login</button>
        <button type="button" class="secondary" id="guestBtn">Login as Guest</button>
      </div>
      <p class="small">Don't have an account? <a class="link" href="register.html">Register here</a></p>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const savedU = localStorage.getItem('username');
      const savedP = localStorage.getItem('password');
      if(u === savedU && p === savedP){
        localStorage.setItem('loggedInUser', u);
        window.location.href = 'clinics.html';
      } else {
        alert('Incorrect username or password.');
      }
    });
    document.getElementById('guestBtn').addEventListener('click', function(){
      localStorage.setItem('loggedInUser', 'Guest');
      window.location.href = 'clinics.html';
    });
  </script>
</body>
</html>
